[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agoralar-store-json"
version = "0.5.2"
description = "JSON-хранилище для AxisLar (плагин AgoraLar)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.15"
# Ядро нужно на импорте контрактов; диапазон следует контракту 5.
dependencies = ["axislar-core>=0.11,<0.12"]

[project.entry-points."agoralar.storage"]
json = "agora_store_json:plugin"

[project.urls]
Source = "https://github.com/authorlarciss/AgoraLar/tree/HEAD/plugins/store_json"
Kernel = "https://github.com/authorlarciss/AxisLar"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mypy>=1.10", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agora_store_json*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.ruff]
line-length = 100
target-version = "py313"
