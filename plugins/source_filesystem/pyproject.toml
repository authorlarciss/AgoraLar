[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agoralar-source-filesystem"
version = "0.3.6"
description = "Файловое дерево как источник объектов для AxisLar (плагин AgoraLar)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.15"
# Ядро нужно на импорте контрактов; диапазон следует релизам ядра (контракт 6).
dependencies = ["axislar-core>=0.14,<0.15"]

[project.entry-points."agoralar.source"]
filesystem = "agora_source_filesystem:plugin"

[project.urls]
Source = "https://github.com/authorlarciss/AgoraLar/tree/HEAD/plugins/source_filesystem"
Kernel = "https://github.com/authorlarciss/AxisLar"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mypy>=1.10", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agora_source_filesystem*"]

# PEP 561: типы едут в колесе.
[tool.setuptools.package-data]
agora_source_filesystem = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.ruff]
line-length = 100
target-version = "py313"
