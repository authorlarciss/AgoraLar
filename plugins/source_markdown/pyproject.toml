[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agoralar-source-markdown"
version = "0.1.2"
description = "Заметки Markdown как источник объектов для AxisLar: frontmatter, #tags, [[wiki-links]]"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.15"
# Ядро нужно на импорте контрактов; диапазон следует релизам ядра (контракт 6).
dependencies = ["axislar-core>=0.14,<0.15"]

[project.entry-points."agoralar.source"]
markdown = "agora_source_markdown:plugin"

[project.urls]
Source = "https://github.com/authorlarciss/AgoraLar/tree/HEAD/plugins/source_markdown"
Kernel = "https://github.com/authorlarciss/AxisLar"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "mypy>=1.10", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agora_source_markdown*"]

# PEP 561: типы едут в колесе.
[tool.setuptools.package-data]
agora_source_markdown = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.ruff]
line-length = 100
target-version = "py313"
