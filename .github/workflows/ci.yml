name: CI

# Ядро (axislar-core) — публичный репозиторий AxisLar, но в PyPI его пока нет.
# CI скачивает колесо из релиза AxisLar по версии, объявленной в
# [tool.uv.sources] продукта: единственный источник истины — pyproject.
# Когда ядро появится в PyPI, шаг «Скачать колесо ядра» удаляется.

on:
  push:
    branches:
      - nu
      - omega
      - "iota/**"
      - "alpha/**"
      - "beta/**"
      - "gamma/**"
      - "delta/**"
      - "epsilon/**"
      - "zeta/**"
      - "lambda/**"
      - "tau/**"
      - "sigma/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - nu
      - omega
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      # Колесо кладётся ровно туда, куда указывает [tool.uv.sources].
      - name: Скачать колесо ядра
        run: |
          version=$(sed -n 's#.*axislar_core-\([0-9][0-9.]*\)-py3-none-any\.whl.*#\1#p' pyproject.toml | head -1)
          test -n "$version" || { echo "не нашёл версию ядра в pyproject.toml" >&2; exit 1; }
          mkdir -p ../AxisLar/dist
          url="https://github.com/authorlarciss/AxisLar/releases/download/v${version}/axislar_core-${version}-py3-none-any.whl"
          echo "ядро $version: $url"
          curl -fsSL -o "../AxisLar/dist/axislar_core-${version}-py3-none-any.whl" "$url"

      # Колесо ядра — файл из релиза, а в uv.lock записан хеш локальной
      # сборки; они не совпадают, если ядро пересобирали. Поэтому ядро
      # ставится отдельно, а не через lock.
      - name: Install dependencies
        run: uv sync --extra dev --no-install-package axislar-core

      - name: Установить колесо ядра
        run: uv pip install --python .venv/bin/python ../AxisLar/dist/axislar_core-*.whl

      - name: Check
        run: make check

  dist:
    name: dist (теги)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Скачать колесо ядра
        run: |
          version=$(sed -n 's#.*axislar_core-\([0-9][0-9.]*\)-py3-none-any\.whl.*#\1#p' pyproject.toml | head -1)
          test -n "$version" || { echo "не нашёл версию ядра в pyproject.toml" >&2; exit 1; }
          mkdir -p ../AxisLar/dist
          url="https://github.com/authorlarciss/AxisLar/releases/download/v${version}/axislar_core-${version}-py3-none-any.whl"
          curl -fsSL -o "../AxisLar/dist/axislar_core-${version}-py3-none-any.whl" "$url"

      - name: Install dependencies
        run: uv sync --extra dev --no-install-package axislar-core

      - name: Установить колесо ядра
        run: uv pip install --python .venv/bin/python ../AxisLar/dist/axislar_core-*.whl

      - name: Build distribution (продукт + плагины)
        run: make dist-all

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

      - name: Attach artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  publish:
    name: publish (PyPI, trusted publishing)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: dist
    runs-on: ubuntu-latest
    # Имя environment должно совпадать с настройкой publisher на PyPI.
    environment: release
    permissions:
      id-token: write   # OIDC для Trusted Publishing, токенов не нужно
      # PEP 740: PyPI принимает аттестации (SLSA provenance) только если
      # у job есть это право. Без него файлы публикуются без provenance.
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      # PyPI выдаёт краткоживущий пропуск по OIDC для каждого проекта,
      # поэтому продукт и каждый плагин публикуются отдельными вызовами.
      - name: Publish to PyPI
        run: |
          set -euo pipefail
          # Пропускаем версии, которые уже есть в индексе: их могли
          # опубликовать вручную, а хеш пересобранного колеса не обязан
          # совпадать. `--check-url` здесь не годится — он падает на
          # несовпадении хеша вместо пропуска.
          already_published() {
            curl -fsS -o /dev/null "https://pypi.org/pypi/$1/$2/json"
          }
          publish() {
            local file project version
            for file in "$@"; do
              project=$(basename "$file" | cut -d- -f1 | tr '_' '-')
              version=$(basename "$file" | cut -d- -f2)
              if already_published "$project" "$version"; then
                echo "skip: $project $version уже в индексе"
                continue
              fi
              uv publish --trusted-publishing always "$file"
            done
          }
          publish dist/agoralar-*.whl dist/agoralar-*.tar.gz
          for plugin in dist/agoralar_*.whl; do
            publish "$plugin"
          done
