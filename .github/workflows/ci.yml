name: CI

on:
  push:
    branches:
      - nu
      - omega
      - "omicron/**"
      - "iota/**"
      - "alpha/**"
      - "beta/**"
      - "gamma/**"
      - "delta/**"
      - "epsilon/**"
      - "zeta/**"
      - "lambda/**"
      - "tau/**"
      - "sigma/**"
  pull_request:
    branches:
      - nu
      - omega

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check
        run: make check

  dist:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Build distribution (nu -> DIST_PACKAGE)
        run: make dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

      - name: Attach artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
