name: CI

# Ядро (axislar-core) ставится из PyPI как обычная зависимость: диапазон
# объявлен в pyproject.toml, временных обходов (локальное колесо из релиза
# AxisLar, --no-install-package) больше нет.

on:
  push:
    branches:
      - nu
      - omega
      - "iota/**"
      - "alpha/**"
      - "beta/**"
      - "gamma/**"
      - "delta/**"
      - "epsilon/**"
      - "zeta/**"
      - "lambda/**"
      - "tau/**"
      - "sigma/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - nu
      - omega
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Check
        run: make check

      # Отчёт покрытия — артефактом, без внешних сервисов: числа проверяемые,
      # а не бейдж, который врёт при первом расхождении.
      - name: Coverage HTML
        if: always()
        run: .venv/bin/coverage html -d .coverage-html || true

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: .coverage-html

  dist:
    name: dist (теги)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    permissions:
      contents: write
      # GitHub-native build provenance: `gh attestation verify dist/*.whl`
      # подтверждает, что артефакт собран этим workflow. Это не PyPI-аттестация
      # (та — publish, PEP 740) и не «SLSA L3».
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Build distribution (продукт + плагины)
        run: make dist-all

      - name: Attest build provenance (GitHub)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

      - name: Attach artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  publish:
    name: publish (PyPI, trusted publishing)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: dist
    runs-on: ubuntu-latest
    # Имя environment должно совпадать с настройкой publisher на PyPI.
    environment: release
    permissions:
      id-token: write   # OIDC для Trusted Publishing, токенов не нужно
      # PEP 740: PyPI принимает аттестации (SLSA provenance) только если
      # у job есть это право. Без него файлы публикуются без provenance.
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      # PyPI выдаёт краткоживущий пропуск по OIDC для каждого проекта,
      # поэтому продукт и каждый плагин публикуются отдельными вызовами.
      # PEP 740: uv uploads attestations, but does not create them.
      # Sidecars (.publish.attestation) подписываются через Sigstore и OIDC
      # этого job, дальше `uv publish` отправляет их вместе с файлами.
      - name: Sign distributions (PEP 740)
        run: |
          set -euo pipefail
          uv run --with pypi-attestations --no-project \
            python -m pypi_attestations sign dist/*.whl dist/*.tar.gz
          ls -1 dist | grep -c attestation

      - name: Publish to PyPI
        run: |
          set -euo pipefail
          # Пропускаем версии, которые уже есть в индексе: их могли
          # опубликовать вручную, а хеш пересобранного колеса не обязан
          # совпадать. `--check-url` здесь не годится — он падает на
          # несовпадении хеша вместо пропуска.
          already_published() {
            curl -fsS -o /dev/null "https://pypi.org/pypi/$1/$2/json"
          }
          publish() {
            local file project version pattern
            for file in "$@"; do
              project=$(basename "$file" | cut -d- -f1 | tr '_' '-')
              version=$(basename "$file" | cut -d- -f2)
              if already_published "$project" "$version"; then
                echo "skip: $project $version уже в индексе"
                continue
              fi
              # Передаём шаблон, а не один файл: тогда uv группирует
              # дистрибутив с его PEP 740 sidecar-аттестацией и загружает
              # их вместе (uv >= 0.9.12).
              pattern="dist/$(basename "$file" | cut -d- -f1)-${version}*"
              uv publish --trusted-publishing always $pattern
            done
          }
          publish dist/agoralar-*.whl dist/agoralar-*.tar.gz
          for plugin in dist/agoralar_*.whl; do
            publish "$plugin"
          done
